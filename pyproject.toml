[project]
name = "recruit"
version = "0.1.0"
description = "Per-student placement shortlist alerts (friends-only pilot)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "python-multipart",
    "jinja2",
    "openpyxl",
    "xlrd",
    "PyYAML",
    "pywebpush",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"