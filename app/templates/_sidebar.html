<!-- Shared authed sidebar: nav + profile dropdown (profile / notifications / logout). -->
<aside class="sidebar">
  <div class="brand-row">
    <img src="/static/favicon.png" alt="" class="brand-logo" width="22" height="22">
    <span class="brand-name">{{ brand }}</span>
  </div>
  <nav class="side-nav">
    <a class="nav-link" href="/dashboard#feed" data-go="feed"><span class="nav-ico">◎</span>Feed</a>
    <a class="nav-link" href="/dashboard#hits" data-go="hits"><span class="nav-ico">◆</span>Your hits</a>
    <a class="nav-link" href="/dashboard#ids" data-go="ids"><span class="nav-ico">+</span>Register IDs</a>
    {% if is_admin %}<a class="nav-link" href="/dashboard#admin" data-go="admin"><span class="nav-ico">⚙</span>Admin</a>{% endif %}
  </nav>
  <div class="side-foot">
    <button id="profile-btn" class="side-avatar" title="Profile">
      <span class="avatar-ico">👤</span><span class="avatar-name">Menu</span>
      <span class="avatar-caret">▾</span>
    </button>
    <div id="profile-menu" class="profile-menu">
      <a class="menu-item" href="/profile"><span class="menu-ico">👤</span>Profile</a>
      <button id="push-status" class="menu-item push-btn not-on" title="Enable Notifications">
        <svg class="push-bell" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="push-label">Enable Notifications</span>
      </button>
      <form id="logout-form" class="logout-form" method="post" action="/api/logout">
        <button type="submit" class="menu-item logout-link" title="Sign out">
          <span class="menu-ico">⏻</span>Log out
        </button>
      </form>
    </div>
  </div>
</aside>
