<!-- Shared authed chrome: top bar (brand + live status) and the bottom tab bar.
     `page` is 'dashboard' or 'profile'. On the dashboard, tabs switch in place
     (app.js intercepts data-go); elsewhere they navigate to /dashboard#tab. -->
<header class="topbar">
  <a class="brand" href="/dashboard#feed" aria-label="{{ brand }} home">
    <svg class="brand-mark" aria-hidden="true"><use href="#i-logo"/></svg>
    <span class="brand-name">{{ brand }}</span>
  </a>
  <div id="live-indicator" class="live" role="status" title="Checking for new mail…">
    <span class="live-dot"></span><span class="live-label">Live</span>
  </div>
</header>

<nav class="tabbar{% if is_admin %} has-admin{% endif %}" aria-label="Sections">
  <a class="tabbar-btn" href="/dashboard#feed" data-go="feed">
    <svg aria-hidden="true"><use href="#i-feed"/></svg><span>Feed</span>
  </a>
  <a class="tabbar-btn" href="/dashboard#hits" data-go="hits">
    <span class="tabbar-ico"><svg aria-hidden="true"><use href="#i-hits"/></svg><b class="tab-badge" id="tab-badge-hits" hidden></b></span><span>Your hits</span>
  </a>
  <a class="tabbar-btn" href="/dashboard#ids" data-go="ids">
    <svg aria-hidden="true"><use href="#i-id"/></svg><span>IDs</span>
  </a>
  {% if is_admin %}
  <a class="tabbar-btn" href="/dashboard#admin" data-go="admin">
    <svg aria-hidden="true"><use href="#i-admin"/></svg><span>Admin</span>
  </a>
  {% endif %}
  <a class="tabbar-btn{% if page == 'profile' %} is-on{% endif %}" href="/profile"{% if page == 'profile' %} aria-current="page"{% endif %}>
    <svg aria-hidden="true"><use href="#i-user"/></svg><span>Profile</span>
  </a>
</nav>

<div id="toasts" class="toasts" aria-live="polite"></div>
