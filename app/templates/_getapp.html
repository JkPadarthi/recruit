{# Slim entry point to the download page. Deliberately quiet: it sits beneath the login
   form, so it is one tappable row — not a second hero competing for attention. #}
{% if apk %}
<a class="appstrip" href="/app">
  <img src="/static/icon-192.png?v=3" width="30" height="30" alt="" class="appstrip-icon">
  <span class="appstrip-text">
    <strong>Get the Android app</strong>
    <em>v{{ apk.version }} · arrives even when Chrome is asleep</em>
  </span>
  <svg class="appstrip-chev" aria-hidden="true"><use href="#i-chev-right"/></svg>
</a>
{% endif %}
