<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07070b">
  <title>{{ brand }}{% block title %}{% endblock %}</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.png?v=2">
  <link rel="icon" type="image/png" sizes="256x256" href="/static/favicon-256.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=6">
</head>
<body class="{% block bodyclass %}{% endblock %}">
  {% block content %}{% endblock %}
</body>
</html>
